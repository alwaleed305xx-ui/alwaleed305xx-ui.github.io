<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم Sora Fashion</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  body { background: #f6f2ed; }
  .adm-top { background: var(--ink); color: #fff; }
  .adm-top .container { display: flex; align-items: center; gap: 1rem; min-height: 64px; flex-wrap: wrap; }
  .adm-top .logo-word { color: #fff; font-size: 1.4rem; }
  .adm-top .grow { flex: 1; }
  .adm-top a { color: #e9dde3; font-size: .9rem; }
  .tabs { display: flex; gap: .3rem; padding-block: 1rem; flex-wrap: wrap; }
  .tab { min-height: 42px; padding: .4rem 1.1rem; border-radius: 999px; font-weight: 600; font-size: .92rem; color: var(--ink-2); background: var(--paper); border: 1.5px solid var(--line); }
  .tab.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .panel { padding-bottom: 4rem; }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 1.2rem 1.3rem; }
  .card + .card { margin-top: 1rem; }
  .card h3 { font-size: 1.02rem; margin-bottom: .8rem; }
  .row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: .8rem; margin-bottom: 1rem; }
  .stat { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 1rem; }
  .stat b { display: block; font-size: 1.45rem; font-weight: 700; }
  .stat span { color: var(--muted); font-size: .82rem; }
  .stat.good b { color: var(--ok); }
  .order { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
  .order + .order { margin-top: .9rem; }
  .order-head { display: flex; gap: .8rem; align-items: center; flex-wrap: wrap; padding: .9rem 1.2rem; border-bottom: 1px solid var(--line); background: #fcfaf7; }
  .order-head .oid { font-weight: 700; direction: ltr; font-family: ui-monospace, Consolas, monospace; }
  .order-body { display: grid; grid-template-columns: 1fr 1.5fr; gap: 1.2rem; padding: 1rem 1.2rem; }
  .pill { font-size: .75rem; font-weight: 700; padding: .18rem .65rem; border-radius: 999px; background: var(--sand); }
  .st-awaiting_payment { background: #eee; color: #666; }
  .st-new, .st-paid { background: #fff1d6; color: #7a5410; }
  .st-processing { background: #e2ecff; color: #234e9c; }
  .st-shipped { background: #e4f3ec; color: #1f6b4d; }
  .st-delivered { background: #d8efe2; color: #14532d; }
  .st-cancelled, .st-refunded { background: #fbe4e2; color: #8a2a24; }
  .kv { font-size: .88rem; display: grid; gap: .3rem; }
  .kv b { font-weight: 600; }
  .mini { font-size: .8rem; color: var(--muted); }
  .items { width: 100%; border-collapse: collapse; font-size: .86rem; }
  .items th, .items td { border-bottom: 1px solid var(--line); padding: .45rem .3rem; text-align: start; vertical-align: top; }
  .items th { color: var(--muted); font-weight: 600; font-size: .78rem; }
  .sup-link { color: var(--plum); font-weight: 700; white-space: nowrap; }
  .sup-missing { color: var(--err); font-size: .78rem; }
  .profit { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: .6rem; font-size: .86rem; }
  .profit b.pos { color: var(--ok); } .profit b.neg { color: var(--err); }
  .order-actions { display: grid; grid-template-columns: repeat(4, 1fr) auto; gap: .6rem; padding: .9rem 1.2rem; border-top: 1px solid var(--line); background: #fcfaf7; align-items: end; }
  .order-actions .field label { font-size: .76rem; }
  .order-actions .input, .order-actions .select { min-height: 40px; padding: .4rem .7rem; font-size: .88rem; }
  .btn-sm { min-height: 38px; padding: .35rem .95rem; font-size: .85rem; }
  .copy-btn { font-size: .78rem; text-decoration: underline; color: var(--plum); margin-inline-start: .4rem; }
  .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: .9rem; }
  .pc { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
  .pc.off { opacity: .5; }
  .pc-media { aspect-ratio: 4 / 3; background: var(--sand); display: flex; justify-content: center; align-items: center; padding: 6px; }
  .pc-media svg, .pc-media img { height: 100%; width: auto; object-fit: contain; }
  .pc-body { padding: .7rem .85rem .85rem; display: flex; flex-direction: column; gap: .25rem; flex: 1; font-size: .86rem; }
  .pc-body b { font-size: .9rem; line-height: 1.4; }
  .pc-actions { display: flex; gap: .35rem; margin-top: auto; padding-top: .5rem; }
  .pc-actions button { flex: 1; min-height: 34px; border: 1.5px solid var(--line); border-radius: 10px; font-size: .78rem; font-weight: 600; }
  .pc-actions button:hover { border-color: var(--ink); }
  .ok-dot { color: var(--ok); font-weight: 700; } .warn-dot { color: #b7791f; font-weight: 700; }
  .editor-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: .8rem; }
  .c2 { grid-column: span 2; } .c4 { grid-column: 1 / -1; }
  .color-rows { display: grid; gap: .45rem; }
  .color-row { display: grid; grid-template-columns: 1fr 52px 36px; gap: .45rem; align-items: center; }
  .color-row input[type=color] { width: 52px; height: 42px; border: 1.5px solid var(--line); border-radius: 10px; padding: 2px; background: #fff; }
  .modal-card.wide { width: min(920px, 100%); }
  .sup-box { background: var(--gold-soft); border-radius: 14px; padding: .9rem; }
  .sup-box h4 { font-size: .9rem; margin-bottom: .6rem; }
  .tbl { width: 100%; border-collapse: collapse; font-size: .86rem; background: var(--paper); border-radius: 14px; overflow: hidden; }
  .tbl th, .tbl td { padding: .55rem .5rem; border-bottom: 1px solid var(--line); text-align: start; }
  .tbl th { background: #fcfaf7; font-weight: 600; color: var(--ink-2); font-size: .8rem; }
  .tbl input { width: 100%; min-height: 36px; border: 1.5px solid var(--line); border-radius: 8px; padding: .3rem .5rem; font-size: .84rem; }
  .help { font-size: .82rem; color: var(--muted); margin-top: .3rem; }
  .banner { border-radius: 14px; padding: .85rem 1rem; font-size: .9rem; margin-bottom: 1rem; }
  .banner.info { background: #eaf2fb; color: #1f4f82; }
  .banner.warn { background: #fff4d6; color: #6b4e12; }
  .banner.ok { background: #e4f3ec; color: #1f6b4d; }
  .coupon-rows { display: grid; gap: .5rem; }
  .coupon-r { display: grid; grid-template-columns: 1.2fr 1fr .8fr 1fr auto auto 36px; gap: .4rem; align-items: center; font-size: .82rem; }
  @media (max-width: 900px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .order-body { grid-template-columns: 1fr; }
    .order-actions { grid-template-columns: 1fr 1fr; }
    .editor-grid { grid-template-columns: 1fr 1fr; }
    .coupon-r { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<div class="adm-top">
  <div class="container">
    <span class="logo-word latin">SORA</span><span>لوحة التحكم</span>
    <span class="grow"></span>
    <a href="index.html" target="_blank">فتح المتجر ↗</a>
  </div>
</div>
<main class="container panel">
  <nav class="tabs" id="tabs">
    <button class="tab on" data-tab="orders">الطلبات</button>
    <button class="tab" data-tab="products">المنتجات</button>
    <button class="tab" data-tab="suppliers">الموردين والأرباح</button>
    <button class="tab" data-tab="settings">الإعدادات والنشر</button>
  </nav>
  <div id="draftBanner"></div>
  <section id="tab-orders"></section>
  <section id="tab-products" hidden></section>
  <section id="tab-suppliers" hidden></section>
  <section id="tab-settings" hidden></section>
</main>

<div class="overlay" id="overlay"></div>
<div class="modal" id="editor" role="dialog" aria-modal="true"><div class="modal-card wide" id="editorCard"></div></div>

<script src="assets/js/garments.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
